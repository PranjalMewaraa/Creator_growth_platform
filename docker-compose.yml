# Local development only. Deployed environments use the managed services chosen in D1b.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cgp
      POSTGRES_PASSWORD: cgp
      POSTGRES_DB: cgp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cgp -d cgp']
      interval: 5s
      retries: 10

  # Transport only (invariant 2): no persistence, so a restart doubles as a queue wipe test.
  # BullMQ requires noeviction.
  redis:
    image: redis:8-alpine
    command:
      ['redis-server', '--maxmemory-policy', 'noeviction', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
